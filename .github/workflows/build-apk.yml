# THE ONLY THING THAT BUILDS THIS APP (android-app.md §1a, Marko 14.9.2026: never on a desk).
#
# PINNED BY COMMIT, NEVER BY TAG. Every SHA below is the one COCKPIT_ANDROID resolved on 27.8.2026
# from the tag in the comment beside it; a moving tag with a token that can push to the account is
# how the GhostAction compromise of 2025 emptied other people's CI secrets.
#
# The delivery gate's boring half runs here on every push (delivery-gate.md §13): provenance,
# secrets over the whole history, the structural checks, the loops counted, Test 1, the built APK
# scanned, the three numbers compared, then publish and keep two.

name: Build ARKOD Layer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: "Gate G1 — provenance"
        id: provenance
        run: |
          set -euo pipefail
          V=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version: $V"
          case "$V" in ''|*[!0-9]*) echo "appVersion is not a whole number"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit: $(git rev-parse HEAD)  branch: ${GITHUB_REF_NAME}"
          DIRTY=$(git status --porcelain | wc -l)
          echo "uncommitted or untracked files: $DIRTY"
          [ "$DIRTY" = "0" ]
          echo "built by: run ${GITHUB_RUN_NUMBER} on ${RUNNER_OS}, not on a desk"

      - name: "Gate G2 — scan the whole history for key shapes"
        run: |
          set -euo pipefail
          COMMITS=$(git rev-list --count HEAD)
          echo "commits examined: $COMMITS"
          HITS=$(git log -p --all | grep -acE '(gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          echo "key-shaped strings in history: ${HITS:-0}"
          [ "${HITS:-0}" = "0" ]

      - name: "Gate G4 — the walking theme against VTM's own schema"
        run: |
          set -uo pipefail
          # The theme is XML that somebody else's parser reads on a hillside, and it has already
          # caught two real faults (a caption key outside the allowed set, a circle attribute that
          # does not exist), so it stays.
          #
          # 18.9.2026: the gate failed on apt-get rather than on the theme — the runner's package
          # mirror answered 100 and the step died, which is a build broken by somebody else's
          # weather. It tries xmllint first and falls back to Python's own validator, so the check
          # is still done however the machine is feeling. If NEITHER is available the gate fails,
          # because a validation that quietly does not happen is worse than no validation.
          curl -sL -o /tmp/rendertheme.xsd https://raw.githubusercontent.com/mapsforge/vtm/0.25.0/resources/rendertheme.xsd
          THEME=app/src/main/assets/themes/mantra-walk.xml
          sudo apt-get install -y libxml2-utils >/dev/null 2>&1 || true
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout --schema /tmp/rendertheme.xsd "$THEME"
            echo "the walking theme validates (xmllint)"
          else
            pip install --quiet xmlschema || { echo "no validator could be installed"; exit 1; }
            python3 - "$THEME" <<'PY'
          import sys
          import xmlschema
          schema = xmlschema.XMLSchema("/tmp/rendertheme.xsd")
          schema.validate(sys.argv[1])
          print("the walking theme validates (xmlschema)")
          PY
          fi

      - name: "Gate G3 — the structural checks"
        run: python3 scripts/verify.py

      - name: "Gate G5 — loops and waits, counted"
        run: |
          set -uo pipefail
          SRC=app/src/main/java/com/mantra/arkod
          echo "source files examined:"; find "$SRC" -name '*.kt' | sed 's/^/  /'
          nocount() { "$@" || true; }
          notcomment() { grep -v ':[[:space:]]*\(//\|\*\)' || true; }
          LOOPS=$( nocount grep -rnE '(while|for|repeat)[[:space:]]*[({]' --include='*.kt' "$SRC" | wc -l)
          UNBOUNDED=$( nocount grep -rnF 'while (true)' --include='*.kt' "$SRC" | notcomment | wc -l)
          echo "loops examined:         $LOOPS"
          # SEVEN, AND EVERY BOUND IS NAMED (Mantra ARKOD, 29.9.2026: the routing, OpenAndroMaps and
          # polyline loops left with their features). Raising this number is a decision, never a
          # reflex, and the name is the decision:
          #   1  the map screen's network sampler — a LaunchedEffect; dies with the composition
          #   2  the map screen's zoom and resting-place reader — the same bound
          #   3  the heading reader that turns the light in front of the position — the same bound
          #   4  the compass overlay's heading reader — the same bound
          #   5  swallowTouches, the sheets' and panels' touch sink — a pointerInput block; Compose
          #      cancels it when the sheet leaves the screen
          #   6  GpxRead's scan — bounded by the text: every turn moves past the match it made
          #   7  MapDownload's read loop — the end of the stream, and the socket's read timeout
          echo "written as while(true): $UNBOUNDED   (every bound is named in the workflow)"
          [ "$UNBOUNDED" -le 7 ] || { echo "an unbounded loop appeared that nobody has justified"; exit 1; }
          grep -q "readTimeout" app/src/main/java/com/mantra/arkod/MapDownload.kt || { echo "the download loop lost its deadline"; exit 1; }
          [ "$LOOPS" -ge 3 ] || { echo "found fewer loops than exist: this check is broken, not the code"; exit 1; }

      - name: "Test 1 — the mechanism"
        run: |
          set -uo pipefail
          ./gradlew :app:testReleaseUnitTest --no-daemon || true
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testReleaseUnitTest/*.xml")
          total = fails = errors = 0
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fails += int(r.get("failures", 0)); errors += int(r.get("errors", 0))
          print(f"result files: {len(files)}   tests run: {total}   failures: {fails}   errors: {errors}")
          if len(files) == 0: sys.exit("no test results at all: the suite did not run")
          if total < 210: sys.exit(f"expected at least 210 cases, found {total}")
          sys.exit(1 if (fails or errors) else 0)
          EOF

      - name: "Gate G2 — no key in the source"
        run: |
          set -euo pipefail
          # Mantra ARKOD (29.9.2026): no Google key reaches this build in any form. Google's map is
          # drawn with the key each person makes and enters on the phone.
          grep -rn 'AIza[0-9A-Za-z_-]\{35\}' app/src --include=* && { echo "a key is written in the source"; exit 1; } || true
          echo "keys in the source: 0"

      - name: Restore the signing key
        id: signing
        env:
          KS: ${{ secrets.ARKOD_KEYSTORE }}
          KS_PW: ${{ secrets.ARKOD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > arkod.p12
            printf 'storeFile=arkod.p12\nstorePassword=%s\nkeyAlias=arkod\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            # NO KEYSTORE SECRET YET (new repository, 29.9.2026). The build is still made, signed
            # with a key made for this run alone, so it can be installed and tested; the release
            # says so, because the next build will not install over it until ARKOD_KEYSTORE exists.
            echo "::warning::ARKOD_KEYSTORE is not set: this build is signed with a throwaway key and cannot be updated in place."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore arkod.p12 -storetype PKCS12 -alias arkod -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass "$PW" -keypass "$PW" -dname "CN=Mantra ARKOD test build" >/dev/null
            printf 'storeFile=arkod.p12\nstorePassword=%s\nkeyAlias=arkod\nkeyPassword=%s\n' "$PW" "$PW" > keystore.properties
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: "Gate G2 — scan the built APK"
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "scanning: $APK ($(stat -c%s "$APK") bytes)"
          # ZERO MEANS ZERO (Mantra ARKOD, 29.9.2026): no key of any shape, Google's included.
          GOOGLE=$(strings -a "$APK" | grep -acE 'AIza[0-9A-Za-z_-]{35}' || true)
          [ "$GOOGLE" = "0" ] || { echo "a Google key is in the APK"; exit 1; }
          OTHERS=$(strings -a "$APK" | grep -acE '(gsk_|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          [ "$OTHERS" = "0" ] || { echo "a key of another shape is in the APK"; exit 1; }
          echo "keys in the APK: 0"

      - name: "Gate G1 — the three numbers agree"
        env:
          V: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          BADGE=$("$AAPT" dump badging "$APK")
          CODE=$(echo "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$(echo "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "gradle.properties: $V    versionCode: $CODE    versionName: $NAME    tag will be: v$V"
          [ "$CODE" = "$V" ]; [ "$NAME" = "$V" ]
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Publish, so the build can be downloaded
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.provenance.outputs.version }}
          KIND: ${{ steps.signing.outputs.kind }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="${V}-arkod-layer-v${V}.apk"
          cp "$APK" "$OUT"
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "NOTHING WAS PUBLISHED: release v${V} already exists. Bump appVersion in gradle.properties if the app changed."
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NOTE="Katastarske čestice Hrvatske (ARKOD) na tri karte, s posjedovnim i vlasničkim listom, i Moje čestice. Build ${GITHUB_RUN_NUMBER} from $(git rev-parse --short HEAD)."
          if [ "$KIND" = "throwaway" ]; then NOTE="TEST BUILD, signed with a throwaway key (ARKOD_KEYSTORE not set): uninstall before installing a later build. $NOTE"; fi
          gh release create "v${V}" "$OUT" --title "ARKOD Layer v${V}" --notes "$NOTE"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "download: https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/${OUT}"
          echo "### Download: [${OUT}](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/${OUT})" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the two newest releases
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag || true
            echo "removed $tag"
          done
