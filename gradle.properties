# THE VERSION, AND IT IS THE ONLY PLACE IT IS WRITTEN.
#
# MANTRA_MANIFEST/modules/versioning.md: one whole number per app, no dots. build.gradle.kts
# turns it into versionCode and versionName, and the workflow reads this same line for the file
# name and the release tag. Mantra ARKOD starts again at 1 (29.9.2026), derived from Mantra
# Trail v94.
appVersion=17

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
